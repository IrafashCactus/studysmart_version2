version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: studysmart-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: studysmart
      POSTGRES_PASSWORD: studysmart_secret
      POSTGRES_DB: studysmart
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studysmart"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studysmart-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: studysmart
      DB_PASSWORD: studysmart_secret
      DB_NAME: studysmart
      CORS_ORIGIN: "http://localhost:5173"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: studysmart-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: "http://localhost:8080"

volumes:
  pgdata:
